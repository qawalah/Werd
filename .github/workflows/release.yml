# DevStore, for a repo with an Android app, a Windows server and its Docker image.
# Every push to main builds them. A bumped versionCode releases the APK
# (tag android-v...). A bumped version in server/devstore.json releases the
# Windows app (tag windows-v...) and publishes the Docker image to
# ghcr.io/qawalah/werd-server (tag docker-v...). Each part releases on its own.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    uses: qawalah/devstore/.github/workflows/android-release.yml@main
    secrets: inherit
    # with:
    #   module: app            # the Android app module, if not "app"

  windows:
    uses: qawalah/devstore/.github/workflows/windows-release.yml@main
    with:
      working-directory: server   # the folder that holds devstore.json

  docker:
    uses: qawalah/devstore/.github/workflows/docker-release.yml@main
    permissions:
      contents: write             # tag and release docker-v...
      packages: write             # push to ghcr.io and delete old versions
    secrets: inherit              # passes GHCR_CLEANUP_TOKEN if it's ever needed
    with:
      working-directory: server   # devstore.json and Dockerfile
